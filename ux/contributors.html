<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contributors</title>
  <style>
    /* ==========================================================
       Design tokens (from Figma styles)
       ========================================================== */
    :root {
      --rich-blue-01: #00004e;   /* Primary/Rich Blue/01 (Brand) */
      --vivid-green-01: #00bf00; /* Components/Button/Background Normal */
      --midnight-01: #00122d;    /* Grayscale/Midnight/01 (Brand) */
      --midnight-02: #334157;    /* Grayscale/Midnight/02 */
      --midnight-03: #808896;    /* Grayscale/Midnight/03 */
      --midnight-04: #e5e7ea;    /* Grayscale/Midnight/04 */
      --midnight-05: #f3f4f5;    /* Grayscale/Midnight/05 */
      --white-06: #ffffff;       /* Grayscale/Midnight/06 (White) */
      --gray-200: #eaecf0;       /* Gray/200 */
      --shadow-sm: 0 1px 3px 0 rgba(16, 24, 40, 0.1), 0 1px 2px 0 rgba(16, 24, 40, 0.06);

      --font-family: "Ping AR + LT", "Ping AR LT", "Segoe UI", Tahoma, Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--white-06);
    }

    /* ==========================================================
       Layout
       ========================================================== */
    .page {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 19px 21px;
      border-radius: 24px;
      background: var(--midnight-05);
    }

    /* ==========================================================
       Toolbar
       ========================================================== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .toolbar__filters {
      display: flex;
      align-items: stretch;
      gap: 16px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 309px;
      height: 48px;
      padding: 8px 16px;
      border: 1px solid var(--midnight-03);
      border-radius: 40px;
      background: var(--white-06);
    }

    .search:focus-within {
      border-color: var(--rich-blue-01);
    }

    .search__icon {
      flex-shrink: 0;
    }

    .search__input {
      flex: 1 0 0;
      min-width: 0;
      border: none;
      outline: none;
      padding: 0;
      background: transparent;
      font-family: inherit;
      font-size: 14px;      /* S/Regular */
      font-weight: 400;
      line-height: 22px;
      color: var(--midnight-01);
    }

    .search__input::placeholder {
      color: var(--midnight-03);
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 12px;
      border: 1px solid var(--midnight-03);
      border-radius: 8px;
      background: var(--white-06);
      font-family: inherit;
      font-size: 14px;      /* S/Medium */
      font-weight: 500;
      line-height: 22px;
      color: var(--midnight-01);
      cursor: pointer;
    }

    .filter-btn:hover {
      background: var(--midnight-05);
    }

    /* ==========================================================
       Buttons
       ========================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;      /* M/Medium */
      font-weight: 500;
      line-height: 24px;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn:focus-visible,
    .filter-btn:focus-visible {
      outline: 2px solid var(--rich-blue-01);
      outline-offset: 2px;
    }

    .btn svg {
      flex-shrink: 0;
    }

    /* Manage Contributors — shown disabled while the list is empty */
    .btn--secondary {
      background: var(--rich-blue-01);
      color: var(--white-06);
    }

    .btn--secondary:disabled {
      background: var(--midnight-03);
      color: var(--midnight-04);
      cursor: not-allowed;
    }

    .btn--green {
      min-width: 180px;
      padding-inline: 20px;
      background: var(--vivid-green-01);
      color: var(--rich-blue-01);
    }

    .btn--green:hover {
      background: #00ab00;
    }

    /* ==========================================================
       Table
       ========================================================== */
    .table-card {
      overflow: hidden;
      border: 1px solid var(--gray-200);
      border-radius: 20px;
      background: var(--white-06);
      box-shadow: var(--shadow-sm);
    }

    .table-scroll {
      overflow-x: auto;
    }

    .table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .table col.col--contributor { width: 320px; }
    .table col.col--actions { width: 64px; }

    .table th {
      height: 44px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--midnight-04);
      background: var(--midnight-05);
      text-align: start;
      font-size: 14px;      /* S/Medium */
      font-weight: 500;
      line-height: 22px;
      color: var(--midnight-02);
      white-space: nowrap;
    }

    .th-content {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ==========================================================
       Empty state
       ========================================================== */
    .empty {
      height: 422px;
      padding: 24px;
    }

    .empty__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 100%;
    }

    .empty__text {
      margin: 0;
      font-size: 14px;      /* S/Regular */
      font-weight: 400;
      line-height: 22px;
      color: var(--midnight-02);
      text-align: center;
    }

    /* ==========================================================
       Responsive
       ========================================================== */
    @media (max-width: 760px) {
      .toolbar {
        flex-direction: column-reverse;
        align-items: stretch;
      }

      .toolbar__filters {
        width: 100%;
      }

      .search {
        flex: 1 0 0;
        width: auto;
        min-width: 0;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 12px;
      }

      .filter-btn__label {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Figma node 189:9292 -->
  <section class="page">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar__filters">
        <label class="search">
          <!-- Stand-in for GOSI3.0/MagnifyingGlass -->
          <svg class="search__icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="6.25" stroke="#808896" stroke-width="1.25"/>
            <path d="m13.5 13.5 3.75 3.75" stroke="#808896" stroke-width="1.25" stroke-linecap="round"/>
          </svg>
          <input type="search" class="search__input" placeholder="Search by name, ID / Iqama number" aria-label="Search by name, ID / Iqama number" />
        </label>

        <button type="button" class="filter-btn">
          <!-- Stand-in for GOSI3.0/SlidersHorizontal -->
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3.125 6.25h3.75M10.625 6.25h6.25M3.125 13.75h8.75M15.625 13.75h1.25" stroke="#00122D" stroke-width="1.25" stroke-linecap="round"/>
            <circle cx="8.75" cy="6.25" r="1.875" stroke="#00122D" stroke-width="1.25"/>
            <circle cx="13.75" cy="13.75" r="1.875" stroke="#00122D" stroke-width="1.25"/>
          </svg>
          <span class="filter-btn__label">Filter</span>
        </button>
      </div>

      <button type="button" class="btn btn--secondary" id="manageBtn" disabled>
        <!-- Stand-in for GOSI3.0/UserGear -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10" cy="9" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M2.75 19.5c1.5-2.6 4.1-4.25 7.25-4.25 1.1 0 2.15.2 3.1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="18" cy="17" r="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M18 13.5v1.5M18 19v1.5M21.03 15.25l-1.3.75M16.27 18l-1.3.75M21.03 18.75l-1.3-.75M16.27 16l-1.3-.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Manage Contributors
      </button>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-scroll">
        <table class="table">
          <colgroup>
            <col class="col--contributor" />
            <col />
            <col />
            <col />
            <col class="col--actions" />
          </colgroup>
          <thead>
            <tr>
              <th scope="col">Contributor</th>
              <th scope="col">Joining Date</th>
              <th scope="col">
                <span class="th-content">
                  Contributory Wage
                  <svg class="riyal" width="16" height="16" viewBox="0 0 16 16" fill="none" role="img" aria-label="SAR"><use href="#icon-riyal"/></svg>
                </span>
              </th>
              <th scope="col">
                <span class="th-content">
                  Benefit Amount
                  <svg class="riyal" width="16" height="16" viewBox="0 0 16 16" fill="none" role="img" aria-label="SAR"><use href="#icon-riyal"/></svg>
                </span>
              </th>
              <th scope="col"><span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Actions</span></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="5" class="empty">
                <div class="empty__inner">
                  <!-- Stand-in for the empty-box illustration -->
                  <svg width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true">
                    <path d="M8 38h48v42H8z" fill="#E5E7EA"/>
                    <path d="M8 38h48v8H8z" fill="#D5D8DD"/>
                    <path d="M8 38 18 28h44l-6 10z" fill="#C8CCD3"/>
                    <path d="m56 38 22 20-16 18-6-8z" fill="#F3F4F5"/>
                    <path d="M56 38 70 22l24 20-16 16z" fill="#EDEEF0" stroke="#D5D8DD"/>
                    <rect x="17" y="15" width="19" height="8" rx="4" fill="#00004E"/>
                    <circle cx="22" cy="19" r="1.2" fill="#fff"/>
                    <circle cx="26.5" cy="19" r="1.2" fill="#fff"/>
                    <circle cx="31" cy="19" r="1.2" fill="#fff"/>
                  </svg>

                  <p class="empty__text">You haven't added any contributors to the initiative yet.</p>

                  <button type="button" class="btn btn--green">
                    <!-- Stand-in for GOSI3.0/Plus -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M3.75 12h16.5M12 3.75v16.5" stroke="#00004E" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Add Contributor
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </section>

  <!-- Stand-in for GOSI3.0 Riyal symbol, referenced in both header cells -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-riyal" viewBox="0 0 16 16">
      <path d="M6.2 1.5v11.2M9.8 2.3v12.2M2.3 6.4l11.4-2.4M2.3 9.6l11.4-2.4M9.4 14.2l4.3-.9" stroke="#334157" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <path d="M2.3 12.4l3.9-.8" stroke="#334157" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
  </svg>
</body>
</html>
