<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Missing IBAN – Daam Initiative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== Design tokens (Figma variables) ===== */
    :root {
      --midnight-01: #00122d;
      --midnight-02: #334157;
      --midnight-03: #808896;
      --midnight-04: #e5e7ea;
      --midnight-05: #f3f4f5;
      --white: #ffffff;
      --rich-blue-01: #00004e;
      --vivid-green-01: #00bf00;

      --font: "Ping AR + LT", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: var(--font); background: #e9ebee; color: var(--midnight-01); -webkit-font-smoothing: antialiased; }
    p, h2, ul { margin: 0; }
    button, input { font-family: inherit; }

    /* ===== Drawer ===== */
    .drawer {
      max-width: 856px; min-height: 700px; margin: 0 auto; padding: 32px 32px 0;
      background: var(--white); border-radius: 20px; overflow: hidden;
      display: flex; flex-direction: column; gap: 20px;
    }
    .drawer[hidden] { display: none; }
    .drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .drawer__title { font-size: 20px; line-height: 28px; font-weight: 700; color: var(--rich-blue-01); }
    .btn-close { width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; flex-shrink: 0; }
    .btn-close svg { display: block; }
    .btn-close:hover { filter: brightness(0.95); }
    .btn-close:focus-visible { outline: 2px solid var(--vivid-green-01); outline-offset: 2px; }

    /* Toolbar */
    .toolbar { display: flex; gap: 16px; height: 48px; }
    .search {
      width: 309px; height: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--white); border: 1px solid var(--midnight-03); border-radius: 40px;
    }
    .search svg { flex-shrink: 0; }
    .search input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0;
      font-size: 14px; line-height: 22px; color: var(--midnight-01);
    }
    .search input::placeholder { color: var(--midnight-03); }
    .search:focus-within { border-color: var(--vivid-green-01); }
    .filter {
      height: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 12px;
      background: var(--white); border: 1px solid var(--midnight-03); border-radius: 8px; cursor: pointer;
      font-size: 14px; line-height: 22px; font-weight: 500; color: var(--midnight-01);
    }

    /* List */
    .rows { list-style: none; padding: 0; }
    .row { display: flex; align-items: center; gap: 12px; padding: 20px 0; }
    .row + .row { border-top: 1px solid var(--midnight-04); }
    .contributor { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; overflow: hidden; }
    .contributor__name { font-size: 14px; line-height: 22px; font-weight: 500; color: var(--midnight-01); }
    .contributor__id { font-size: 12px; line-height: 18px; color: var(--midnight-03); }

    /* Input field — empty: 56px, value only. Filled: 64px, label above value. */
    .field {
      height: 56px; padding: 16px 12px; display: flex; align-items: center; gap: 12px;
      border: 1px solid var(--midnight-03); border-radius: 8px; overflow: hidden; cursor: text;
    }
    .field--iban { flex: 1 1 0; min-width: 0; background: var(--white); }
    .field--bank { width: 172px; flex-shrink: 0; background: var(--midnight-04); cursor: default; }
    .field__inner { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .field__label { display: none; font-size: 12px; line-height: 18px; color: var(--midnight-03); }
    .field__input {
      width: 100%; height: 24px; padding: 0; border: 0; outline: 0; background: transparent;
      font-size: 16px; line-height: 24px; font-weight: 500;
    }
    .field--iban .field__input, .field--iban .field__input::placeholder { color: var(--rich-blue-01); opacity: 1; }
    .field--bank .field__input, .field--bank .field__input::placeholder { color: var(--midnight-03); opacity: 1; cursor: default; }
    .field__icon { display: none; flex-shrink: 0; width: 24px; height: 24px; }
    .field--iban.is-valid .field__icon { display: block; }
    .field--iban:focus-within { border-color: var(--vivid-green-01); }
    .row:has(.field--iban .field__input:not(:placeholder-shown)) .field { height: 64px; padding: 12px; }
    .row:has(.field--iban .field__input:not(:placeholder-shown)) .field__label { display: block; }

    /* Footer (pinned to the bottom of the drawer) */
    .drawer__foot {
      margin: auto -32px 0; padding: 22px 32px 16px; border-top: 1px solid var(--midnight-04); background: var(--white);
      display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    }
    .btn {
      height: 48px; padding: 8px 24px; border-radius: 8px; cursor: pointer; white-space: nowrap;
      font-size: 16px; line-height: 24px; font-weight: 500; color: var(--rich-blue-01); text-align: center;
    }
    .btn--secondary { background: var(--white); border: 1px solid var(--vivid-green-01); }
    .btn--primary { background: var(--vivid-green-01); border: 0; }
    .btn--primary:disabled { background: var(--midnight-03); color: var(--midnight-04); cursor: not-allowed; }
    .btn:hover:not(:disabled) { filter: brightness(0.96); }
    .btn:focus-visible, .filter:focus-visible { outline: 2px solid var(--vivid-green-01); outline-offset: 2px; }

    .reopen { display: block; margin: 0 auto; }
    .reopen[hidden] { display: none; }

    /* ===== Responsive ===== */
    @media (max-width: 700px) {
      .row { flex-wrap: wrap; }
      .contributor { width: 100%; }
    }
    @media (max-width: 600px) {
      body { padding: 0; }
      .drawer { border-radius: 0; padding: 20px 16px 0; min-height: 100vh; }
      .drawer__foot { margin: auto -16px 0; padding: 16px; }
      .btn { flex: 1; }
      .toolbar { height: auto; flex-wrap: wrap; }
      .search { width: 100%; height: 48px; }
      .filter { height: 48px; }
      .field--iban, .field--bank { flex-basis: 100%; width: 100%; }
    }
  </style>
</head>

  <button type="button" class="btn btn--primary reopen" id="reopen" hidden>Open “Add Missing IBAN”</button>

  <script>
    // IBAN: uppercase, group in 4s, seal-check when it's a valid Saudi IBAN format (SA + 22 digits)
    const SA_IBAN = /^SA\d{22}$/;
    const fields = [...document.querySelectorAll('.field--iban')];
    const submitBtn = document.getElementById('submitBtn');
    const refresh = () => { submitBtn.disabled = !fields.every(f => f.classList.contains('is-valid')); };
    fields.forEach(field => {
      const input = field.querySelector('input');
      input.addEventListener('input', () => {
        const raw = input.value.replace(/\s+/g, '').toUpperCase().slice(0, 24);
        input.value = raw.replace(/(.{4})(?=.)/g, '$1 ');
        field.classList.toggle('is-valid', SA_IBAN.test(raw));
        refresh();
      });
    });
    refresh();

    // Close (✕ / Back / Esc) and reopen
    const drawer = document.getElementById('drawer');
    const reopen = document.getElementById('reopen');
    const close = () => { drawer.hidden = true; reopen.hidden = false; reopen.focus(); };
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) close(); });
    reopen.addEventListener('click', () => { drawer.hidden = false; reopen.hidden = true; });
  </script>
