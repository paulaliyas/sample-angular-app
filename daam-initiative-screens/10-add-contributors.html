<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Contributors – Daam Initiative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== Design tokens (Figma variables) ===== */
    :root {
      --midnight-01: #00122d;
      --midnight-02: #334157;
      --midnight-03: #808896;
      --midnight-04: #e5e7ea;
      --midnight-05: #f3f4f5;
      --white: #ffffff;
      --rich-blue-01: #00004e;
      --vivid-green-01: #00bf00;

      --font: "Ping AR + LT", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: var(--font); background: #e9ebee; color: var(--midnight-01); -webkit-font-smoothing: antialiased; }
    p, h2 { margin: 0; }
    button, input { font-family: inherit; }

    /* ===== Drawer / Add contributors ===== */
    .drawer {
      max-width: 856px; margin: 0 auto; padding: 32px 32px 0;
      background: var(--white); border-radius: 20px; overflow: hidden;
      display: flex; flex-direction: column; gap: 20px;
    }
    .drawer[hidden] { display: none; }
    .drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .drawer__title { font-size: 20px; line-height: 28px; font-weight: 700; color: var(--rich-blue-01); }
    .btn-close { width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; flex-shrink: 0; }
    .btn-close svg { display: block; }
    .btn-close:hover { filter: brightness(0.95); }
    .btn-close:focus-visible { outline: 2px solid var(--vivid-green-01); outline-offset: 2px; }

    /* Toolbar */
    .toolbar { display: flex; gap: 16px; height: 48px; }
    .search {
      width: 309px; height: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--white); border: 1px solid var(--midnight-03); border-radius: 40px;
    }
    .search svg { flex-shrink: 0; }
    .search input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0;
      font-size: 14px; line-height: 22px; color: var(--midnight-01);
    }
    .search input::placeholder { color: var(--midnight-03); }
    .search:focus-within { border-color: var(--vivid-green-01); }
    .filter {
      height: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 12px;
      background: var(--white); border: 1px solid var(--midnight-03); border-radius: 8px; cursor: pointer;
      font-size: 14px; line-height: 22px; font-weight: 500; color: var(--midnight-01);
    }

    /* Table */
    .table-wrap { background: var(--white); border: 1px solid var(--midnight-04); border-radius: 20px; overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 740px; }
    th {
      height: 44px; padding: 12px; text-align: left; white-space: nowrap;
      background: var(--midnight-05); border-bottom: 1px solid var(--midnight-04);
      font-size: 14px; line-height: 22px; font-weight: 500; color: var(--midnight-02);
    }
    td {
      height: 72px; padding: 16px 12px; white-space: nowrap;
      border-bottom: 1px solid var(--midnight-04);
      font-size: 14px; line-height: 22px; color: var(--midnight-02);
    }
    th:first-child, td:first-child { padding-left: 14px; padding-right: 14px; }
    .th-inline { display: inline-flex; align-items: center; gap: 4px; }
    .th-check { display: flex; align-items: center; gap: 12px; }
    .contributor { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .contributor__text { display: flex; flex-direction: column; line-height: 22px; min-width: 0; }
    .contributor__name { font-weight: 500; color: var(--midnight-01); overflow: hidden; text-overflow: ellipsis; }
    .contributor__id { color: var(--midnight-03); }

    /* Checkbox — exact Figma vector (20x20 box, tick overflows to 25px) */
    .cb {
      appearance: none; -webkit-appearance: none; flex-shrink: 0; cursor: pointer;
      width: 25px; height: 20px; margin: 0 -5px 0 0; border: 0;
      background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2225%22 height=%2220%22 viewBox=%220 0 25 20%22 fill=%22none%22%3E%3Crect x=%220.75%22 y=%220.75%22 width=%2218.5%22 height=%2218.5%22 rx=%221.25%22 stroke=%22%2300004E%22 stroke-width=%221.5%22/%3E%3C/svg%3E") no-repeat 0 0 / 25px 20px;
    }
    .cb:checked { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2225%22 height=%2220%22 viewBox=%220 0 25 20%22 fill=%22none%22%3E%3Crect x=%220.75%22 y=%220.75%22 width=%2218.5%22 height=%2218.5%22 rx=%221.25%22 stroke=%22%2300004E%22 stroke-width=%221.5%22/%3E%3Cpath d=%22M24 2L10.9375 14L5 8.54545%22 stroke=%22%2300BF00%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E"); }
    .cb:focus-visible { outline: 2px solid var(--vivid-green-01); outline-offset: 2px; }

    /* Pagination */
    .pagination { display: flex; align-items: center; gap: 12px; padding: 12px 24px 16px; }
    .pagination__side { flex: 1 1 0; display: flex; }
    .pagination__side--end { justify-content: flex-end; }
    .btn-page {
      width: 100px; height: 36px; padding: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--white); border: 1px solid var(--vivid-green-01); border-radius: 6px; cursor: pointer;
      font-size: 14px; line-height: 22px; font-weight: 500; color: var(--rich-blue-01);
    }
    .pages { display: flex; gap: 2px; }
    .page {
      width: 40px; height: 40px; padding: 8px; border: 0; border-radius: 20px; background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 22px; font-weight: 500; color: var(--midnight-02);
    }
    .page--gap { cursor: default; }
    .page--active { background: var(--midnight-05); color: var(--midnight-01); }

    /* Footer */
    .drawer__foot {
      margin: 0 -32px; padding: 22px 32px 16px; border-top: 1px solid var(--midnight-04); background: var(--white);
      display: flex; align-items: center; gap: 12px;
    }
    .counter { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
    .counter__num { font-size: 18px; line-height: 26px; font-weight: 700; color: var(--vivid-green-01); }
    .counter__sel { font-size: 14px; line-height: 22px; color: var(--vivid-green-01); }
    .counter__rest { font-size: 14px; line-height: 22px; color: var(--midnight-02); }
    .spacer { flex: 1 1 0; }
    .btn {
      height: 48px; padding: 8px 24px; border-radius: 8px; cursor: pointer; white-space: nowrap;
      font-size: 16px; line-height: 24px; font-weight: 500; color: var(--rich-blue-01); text-align: center;
    }
    .btn--secondary { background: var(--white); border: 1px solid var(--vivid-green-01); }
    .btn--primary { background: var(--vivid-green-01); border: 0; }
    .btn--primary:disabled { background: var(--midnight-03); color: var(--midnight-04); cursor: not-allowed; }
    .btn:hover:not(:disabled), .btn-page:hover { filter: brightness(0.96); }
    .btn:focus-visible, .btn-page:focus-visible, .filter:focus-visible { outline: 2px solid var(--vivid-green-01); outline-offset: 2px; }

    .reopen { display: block; margin: 0 auto; }
    .reopen[hidden] { display: none; }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      body { padding: 0; }
      .drawer { border-radius: 0; padding: 20px 16px 0; }
      .drawer__foot { margin: 0 -16px; padding: 16px; flex-wrap: wrap; }
      .spacer { display: none; }
      .counter { flex-basis: 100%; }
      .btn { flex: 1; }
      .toolbar { height: auto; flex-wrap: wrap; }
      .search { width: 100%; height: 48px; }
      .filter { height: 48px; }
      .pagination { flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>

        <span class="counter__num" id="selCount">3</span>
        <span class="counter__sel">selected</span>
        <span class="counter__rest">/ 20 remains</span>
      </p>
      <div class="spacer"></div>
      <button type="button" class="btn btn--secondary" data-close>Cancel</button>
      <button type="button" class="btn btn--primary" id="addBtn">Add contributors</button>
    </footer>
  </section>

  <button type="button" class="btn btn--primary reopen" id="reopen" hidden>Open “Add contributors”</button>

  <script>
    const drawer = document.getElementById('drawer');
    const reopen = document.getElementById('reopen');
    const selectAll = document.getElementById('selectAll');
    const rowBoxes = [...document.querySelectorAll('.cb--row')];
    const selCount = document.getElementById('selCount');
    const addBtn = document.getElementById('addBtn');

    const refresh = () => {
      const n = rowBoxes.filter(b => b.checked).length;
      selCount.textContent = n;
      addBtn.disabled = n === 0;
      selectAll.checked = n === rowBoxes.length;
    };
    selectAll.addEventListener('change', () => { rowBoxes.forEach(b => { b.checked = selectAll.checked; }); refresh(); });
    rowBoxes.forEach(b => b.addEventListener('change', refresh));
    refresh();

    // Close (✕ / Cancel / Esc) and reopen
    const close = () => { drawer.hidden = true; reopen.hidden = false; reopen.focus(); };
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) close(); });
    reopen.addEventListener('click', () => { drawer.hidden = false; reopen.hidden = true; });

    // Pagination
    document.querySelectorAll('button.page').forEach(p => p.addEventListener('click', () => {
      document.querySelectorAll('button.page').forEach(x => { x.classList.toggle('page--active', x === p); x.toggleAttribute('aria-current', x === p); });
    }));
  </script>
