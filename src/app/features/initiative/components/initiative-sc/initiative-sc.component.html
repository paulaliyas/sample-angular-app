<ng-container [ngSwitch]="step">
  <app-about-initiative-dc
    *ngSwitchCase="'about'"
    (apply)="onApply()"
  ></app-about-initiative-dc>

  <app-establishment-details-dc
    *ngSwitchCase="'establishment'"
    [establishment]="establishment"
    (save)="onSaveApplication()"
    (back)="goTo('about')"
  ></app-establishment-details-dc>

  <app-contributors-dc
    *ngSwitchCase="'contributors'"
    [contributors]="addedContributors"
    (manage)="onManageContributors()"
    (remove)="onRemoveContributor($event)"
  ></app-contributors-dc>

  <app-add-contributors-dc
    *ngSwitchCase="'add-contributors'"
    [contributors]="allContributors"
    [selectedContributors]="addedContributors"
    [maxCount]="maxContributors"
    (save)="onSaveContributors($event)"
    (back)="goTo('contributors')"
  ></app-add-contributors-dc>
</ng-container>
