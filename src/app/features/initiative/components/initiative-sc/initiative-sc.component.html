<div class="sc-message" role="alert" *ngIf="error">
  <span>{{ error | translate }}</span>
  <button type="button" class="btn-link" *ngIf="!loaded" (click)="load()">{{ 'initiative.common.tryAgain' | translate }}</button>
</div>

<p class="sc-message" *ngIf="loading">{{ 'initiative.common.loading' | translate }}</p>

<ng-container *ngIf="loaded" [ngSwitch]="step">
  <app-apply-dc
    *ngSwitchCase="'apply'"
    [establishment]="establishment"
    [faqs]="faqs"
    (apply)="onApply()"
  ></app-apply-dc>

  <app-choose-contributors-dc
    *ngSwitchCase="'choose-contributors'"
    [contributors]="eligibleContributors"
    [maxCount]="maxContributors"
    [selection]="selection"
    [preparedSelection]="preparedSelection"
    (strategyChange)="onStrategyChange($event)"
    (next)="onChooseContributors($event)"
    (cancel)="goTo('apply')"
  ></app-choose-contributors-dc>

  <app-bank-account-dc
    *ngSwitchCase="'bank-account'"
    [contributors]="applicationContributors"
    [bankNames]="bankNames"
    (ibanEntered)="onIbanEntered($event)"
    (next)="onBankAccountNext($event)"
    (back)="goTo('choose-contributors')"
  ></app-bank-account-dc>

  <app-request-summary-dc
    *ngSwitchCase="'summary'"
    [establishment]="establishment"
    [strategyTitle]="strategyTitle"
    [contributorCount]="applicationContributors.length"
    [maxCount]="maxContributors"
    [eligibleCount]="eligibleContributors.length"
    [totalBenefit]="totalBenefit"
    [busy]="saving"
    (edit)="goTo('choose-contributors')"
    (back)="goTo('bank-account')"
    (submitRequest)="onSubmitRequest()"
  ></app-request-summary-dc>

  <main class="content" *ngSwitchCase="'dashboard'">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" [class.tab--active]="dashboardTab === 'requests'" [attr.aria-selected]="dashboardTab === 'requests'" (click)="dashboardTab = 'requests'">
        {{ 'initiative.dashboard.requestsTab' | translate: { count: requests.length } }}
      </button>
      <button type="button" class="tab" role="tab" [class.tab--active]="dashboardTab === 'members'" [attr.aria-selected]="dashboardTab === 'members'" (click)="dashboardTab = 'members'">
        {{ 'initiative.dashboard.membersTab' | translate: { count: members.length } }}
      </button>
      <button type="button" class="tab" role="tab" [class.tab--active]="dashboardTab === 'iban-updates'" [attr.aria-selected]="dashboardTab === 'iban-updates'" (click)="dashboardTab = 'iban-updates'">
        {{ 'initiative.dashboard.ibanTab' | translate: { count: ibanUpdates.length } }}
      </button>
    </div>

    <ng-container [ngSwitch]="dashboardTab">
      <app-requests-dc *ngSwitchCase="'requests'" [requests]="requests"></app-requests-dc>

      <app-manage-contributors-dc
        *ngSwitchCase="'members'"
        [members]="members"
        [maxCount]="maxContributors"
        [busy]="saving"
        (add)="openDrawer('add-contributors')"
        (remove)="onRemoveMembers($event)"
      ></app-manage-contributors-dc>

      <app-iban-update-dc *ngSwitchCase="'iban-updates'" [updates]="ibanUpdates"></app-iban-update-dc>
    </ng-container>
  </main>
</ng-container>

<app-add-contributors-dc
  *ngIf="drawer === 'add-contributors'"
  [contributors]="candidates"
  [remaining]="remainingPlaces"
  [selected]="pendingAdditions"
  [busy]="saving"
  (add)="onAddContributors($event)"
  (close)="closeDrawer()"
></app-add-contributors-dc>

<app-add-missing-iban-dc
  *ngIf="drawer === 'missing-iban'"
  [contributors]="pendingAdditions"
  [drafts]="ibanDrafts"
  [bankNames]="bankNames"
  [busy]="saving"
  (ibanEntered)="onIbanEntered($event)"
  (submitIbans)="onMissingIbansSubmitted($event)"
  (back)="onMissingIbansBack($event)"
></app-add-missing-iban-dc>
