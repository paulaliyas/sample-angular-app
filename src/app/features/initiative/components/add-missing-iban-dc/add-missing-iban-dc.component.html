<div class="drawer-backdrop" (click)="onBack()">
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="iban-drawer-title" (click)="$event.stopPropagation()">
    <header class="drawer__head">
      <h2 id="iban-drawer-title" class="drawer__title">{{ 'initiative.missingDrawer.title' | translate }}</h2>
      <button #closeButton type="button" class="btn-close" [attr.aria-label]="'initiative.common.close' | translate" (click)="onBack()"><app-icon-dc name="close"></app-icon-dc></button>
    </header>

    <div class="toolbar">
      <label class="search">
        <app-icon-dc name="search"></app-icon-dc>
        <input type="search" [placeholder]="'initiative.common.search' | translate" [attr.aria-label]="'initiative.common.searchContributors' | translate" [(ngModel)]="searchText" />
      </label>
      <!-- TODO: the filter panel isn't designed yet -->
      <button type="button" class="filter"><app-icon-dc name="filter"></app-icon-dc><span>{{ 'initiative.common.filter' | translate }}</span></button>
    </div>

    <ul class="rows">
      <li class="row" *ngFor="let c of filteredContributors">
        <div class="contributor">
          <span class="contributor__name">{{ c.name }}</span>
          <span class="contributor__id">{{ 'initiative.common.idNo' | translate: { id: c.nnid } }}</span>
        </div>

        <label class="field field--iban">
          <span class="field__inner">
            <span class="field__label">{{ 'initiative.common.iban' | translate }}</span>
            <input
              #ibanInput
              type="text"
              class="field__input"
              [placeholder]="'initiative.common.iban' | translate"
              autocomplete="off"
              spellcheck="false"
              [value]="ibans[c.nnid]"
              [attr.aria-label]="'initiative.common.ibanFor' | translate: { name: c.name }"
              (input)="onInput(c, ibanInput)"
              (change)="onChange(c)"
            />
          </span>
        </label>

        <label class="field field--bank">
          <span class="field__inner">
            <span class="field__label">{{ 'initiative.common.bankName' | translate }}</span>
            <input
              type="text"
              class="field__input"
              [placeholder]="'initiative.common.bankName' | translate"
              readonly
              tabindex="-1"
              [value]="bankOf(c)"
              [attr.aria-label]="'initiative.common.bankNameFor' | translate: { name: c.name }"
            />
          </span>
        </label>
      </li>

      <li class="row no-results" *ngIf="filteredContributors.length === 0">{{ 'initiative.common.noMatches' | translate }}</li>
    </ul>

    <footer class="drawer__foot">
      <button type="button" class="btn btn--secondary" (click)="onBack()">{{ 'initiative.common.back' | translate }}</button>
      <button type="button" class="btn btn--primary" [disabled]="!allFilled || busy" (click)="onSubmit()">{{ 'initiative.common.submit' | translate }}</button>
    </footer>
  </section>
</div>
