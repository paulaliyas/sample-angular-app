<div class="drawer-backdrop" (click)="onBack()">
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="iban-drawer-title" (click)="$event.stopPropagation()">
    <header class="drawer__head">
      <h2 id="iban-drawer-title" class="drawer__title">Add Missing IBAN</h2>
      <button #closeButton type="button" class="btn-close" aria-label="Close" (click)="onBack()"><app-icon-dc name="close"></app-icon-dc></button>
    </header>

    <div class="toolbar">
      <label class="search">
        <app-icon-dc name="search"></app-icon-dc>
        <input type="search" placeholder="Search by name, ID / Iqama number" aria-label="Search contributors" [(ngModel)]="searchText" />
      </label>
      <!-- TODO: the filter panel isn't designed yet -->
      <button type="button" class="filter"><app-icon-dc name="filter"></app-icon-dc><span>Filter</span></button>
    </div>

    <ul class="rows">
      <li class="row" *ngFor="let c of filteredContributors">
        <div class="contributor">
          <span class="contributor__name">{{ c.name }}</span>
          <span class="contributor__id">ID No: {{ c.nnid }}</span>
        </div>

        <label class="field field--iban">
          <span class="field__inner">
            <span class="field__label">IBAN</span>
            <input
              #ibanInput
              type="text"
              class="field__input"
              placeholder="IBAN"
              autocomplete="off"
              spellcheck="false"
              [value]="ibans[c.nnid]"
              [attr.aria-label]="'IBAN for ' + c.name"
              (input)="onInput(c, ibanInput)"
              (change)="onChange(c)"
            />
          </span>
        </label>

        <label class="field field--bank">
          <span class="field__inner">
            <span class="field__label">Bank name</span>
            <input
              type="text"
              class="field__input"
              placeholder="Bank name"
              readonly
              tabindex="-1"
              [value]="bankOf(c)"
              [attr.aria-label]="'Bank name for ' + c.name"
            />
          </span>
        </label>
      </li>

      <li class="row no-results" *ngIf="filteredContributors.length === 0">No contributors match your search.</li>
    </ul>

    <footer class="drawer__foot">
      <button type="button" class="btn btn--secondary" (click)="onBack()">Back</button>
      <button type="button" class="btn btn--primary" [disabled]="!allFilled || busy" (click)="onSubmit()">Submit</button>
    </footer>
  </section>
</div>
