<section class="card how" [class.how--attached]="attached" aria-labelledby="how-title">
  <h2 id="how-title" class="section-title">How it works</h2>
  <ol class="steps">
    <li
      *ngFor="let step of steps; let i = index"
      class="step"
      [class.step--done]="i + 1 < currentStep"
      [class.step--active]="i + 1 === currentStep"
      [attr.aria-current]="i + 1 === currentStep ? 'step' : null"
    >
      <span class="step__num">
        <app-icon-dc *ngIf="i + 1 < currentStep; else stepNumber" name="check"></app-icon-dc>
        <ng-template #stepNumber>{{ i + 1 }}</ng-template>
      </span>
      <div class="step__text">
        <span class="step__title">{{ step.title }}</span>
        <span class="step__desc">{{ step.description }}</span>
      </div>
    </li>
  </ol>
</section>
