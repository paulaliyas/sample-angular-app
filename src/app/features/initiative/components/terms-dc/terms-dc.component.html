<div class="modal-backdrop" (click)="close.emit()">
  <section class="terms" role="dialog" aria-modal="true" aria-labelledby="terms-dialog-title" (click)="$event.stopPropagation()">
    <header class="terms__head">
      <h2 id="terms-dialog-title" class="terms__heading">{{ 'initiative.terms.heading' | translate }}</h2>
      <button #closeButton type="button" class="terms__close" [attr.aria-label]="'initiative.common.close' | translate" (click)="close.emit()">
        <app-icon-dc name="close-small"></app-icon-dc>
      </button>
    </header>

    <div class="terms__body" tabindex="0" [attr.aria-label]="'initiative.terms.bodyLabel' | translate">
      <h3 class="terms__title">{{ content.title }}</h3>
      <div class="terms__text">
        <ng-container *ngFor="let section of content.sections">
          <h4 class="terms__section" *ngIf="section.title">{{ section.title }}</h4>
          <p *ngFor="let clause of section.clauses">{{ clause }}</p>
        </ng-container>
      </div>
    </div>
  </section>
</div>
