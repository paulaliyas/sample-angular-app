<main class="content">
  <div class="stack">
    <app-how-it-works-dc [currentStep]="3"></app-how-it-works-dc>

    <section class="update" aria-labelledby="update-title">
      <div class="update__head">
        <h2 id="update-title" class="block-title">{{ 'initiative.bank.title' | translate }}</h2>
        <div class="toast" role="status" *ngIf="stillMissingCount > 0">
          <app-icon-dc name="warning"></app-icon-dc>
          <p>{{ 'initiative.bank.stillMissing' | translate: { count: stillMissingCount } }}</p>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" [class.tab--active]="tab === 'missing'" [attr.aria-selected]="tab === 'missing'" (click)="showTab('missing')">
          {{ 'initiative.bank.missingTab' | translate: { count: missingCount } }}
        </button>
        <button type="button" class="tab" role="tab" [class.tab--active]="tab === 'existing'" [attr.aria-selected]="tab === 'existing'" (click)="showTab('existing')">
          {{ 'initiative.bank.existingTab' | translate: { count: existingCount } }}
        </button>
      </div>

      <div class="toolbar">
        <label class="search">
          <app-icon-dc name="search"></app-icon-dc>
          <input
            type="search"
            [placeholder]="'initiative.common.search' | translate"
            [attr.aria-label]="'initiative.common.searchContributors' | translate"
            [(ngModel)]="searchText"
            (ngModelChange)="onSearch()"
          />
        </label>
        <!-- TODO: the filter panel isn't designed yet -->
        <button type="button" class="filter"><app-icon-dc name="filter"></app-icon-dc><span>{{ 'initiative.common.filter' | translate }}</span></button>
      </div>

      <div class="task-list">
        <ul class="rows">
          <li class="row" *ngFor="let c of pagedContributors" [class.is-editing]="editingId === c.nnid">
            <div class="contributor">
              <span class="contributor__name">{{ c.name }}</span>
              <span class="contributor__id">{{ 'initiative.common.idNo' | translate: { id: c.nnid } }}</span>
            </div>

            <label class="field field--iban" [class.is-verified]="isVerified(c)" [class.is-locked]="isLocked(c)">
              <span class="field__inner">
                <span class="field__label">{{ 'initiative.common.iban' | translate }}</span>
                <input
                  #ibanInput
                  type="text"
                  class="field__input"
                  [placeholder]="'initiative.common.iban' | translate"
                  autocomplete="off"
                  spellcheck="false"
                  [value]="valueOf(c)"
                  [readOnly]="isLocked(c)"
                  [attr.aria-label]="'initiative.common.ibanFor' | translate: { name: c.name }"
                  (input)="onInput(c, ibanInput)"
                  (change)="onChange(c)"
                  (keydown.enter)="saveEdit()"
                  (keydown.escape)="cancelEdit()"
                />
              </span>
              <span class="field__icon"><app-icon-dc name="seal-check"></app-icon-dc></span>
            </label>

            <label class="field field--bank">
              <span class="field__inner">
                <span class="field__label">{{ 'initiative.common.bankName' | translate }}</span>
                <input
                  type="text"
                  class="field__input"
                  [placeholder]="'initiative.common.bankName' | translate"
                  readonly
                  tabindex="-1"
                  [value]="bankOf(c)"
                  [attr.aria-label]="'initiative.common.bankNameFor' | translate: { name: c.name }"
                />
              </span>
            </label>

            <div class="actions" *ngIf="tab === 'existing'">
              <button
                type="button"
                class="btn-icon btn-edit"
                [disabled]="editingId !== null"
                [attr.aria-label]="'initiative.bank.editFor' | translate: { name: c.name }"
                (click)="startEdit(c, ibanInput)"
              >
                <app-icon-dc name="pencil"></app-icon-dc>
              </button>
              <button
                type="button"
                class="btn-icon btn-save"
                [disabled]="!editValue.trim()"
                [attr.aria-label]="'initiative.bank.saveFor' | translate: { name: c.name }"
                (click)="saveEdit()"
              >
                <app-icon-dc name="save"></app-icon-dc>
              </button>
              <button type="button" class="btn-icon btn-cancel" [attr.aria-label]="'initiative.bank.cancelFor' | translate: { name: c.name }" (click)="cancelEdit()">
                <app-icon-dc name="cancel"></app-icon-dc>
              </button>
            </div>
          </li>

          <li class="row no-results" *ngIf="filteredContributors.length === 0">{{ 'initiative.common.noContributors' | translate }}</li>
        </ul>

        <app-pagination-dc [page]="page" [totalPages]="totalPages" (pageChange)="goToPage($event)"></app-pagination-dc>
      </div>
    </section>
  </div>

  <section class="card submit-bar">
    <button type="button" class="btn btn--secondary" (click)="back.emit()">{{ 'initiative.common.cancel' | translate }}</button>
    <button type="button" class="btn btn--primary" [disabled]="editingId !== null" (click)="onNext()">{{ 'initiative.common.next' | translate }}</button>
  </section>
</main>
