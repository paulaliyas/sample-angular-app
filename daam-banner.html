<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daam Initiative Banner</title>
  <style>
    /* ==========================================================
       Design tokens (from Figma styles)
       ========================================================== */
    :root {
      --vivid-blue: #0064ff;     /* Vivid Blue */
      --rich-blue-01: #00004e;   /* Primary/Rich Blue/01 (Brand) */
      --rich-blue-03: #8080a6;   /* Primary/Rich Blue/03 */
      --vivid-green-01: #00bf00; /* Primary/Vivid Green/01 (Brand) */
      --white-06: #ffffff;       /* Grayscale/Midnight/06 (White) */
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--white-06);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ==========================================================
       Banner (Figma node 178:12006 — 622 × 220)
       Every layer sits at its exact Figma coordinates, expressed in
       design pixels × --u, so the whole banner scales with its container.
       ========================================================== */
    .banner-wrap {
      container-type: inline-size;
      width: 100%;
      max-width: 1244px; /* 2× the design; remove to let it grow freely */
    }

    .banner {
      /* 1 design pixel = container width / 622 */
      --u: calc(100cqw / 622);
      position: relative;
      width: 100%;
      height: calc(220 * var(--u));
      overflow: hidden;
      border-radius: calc(34.168 * var(--u));
      background: var(--vivid-blue);
    }

    /* Illustration + chevron pattern (right calc(282 * var(--u))) */
    .banner__art {
      position: absolute;
      top: 0;
      right: 0;
      display: block;
      width: calc(282 * var(--u));
      height: calc(220 * var(--u));
      pointer-events: none;
    }

    /* SVG sizes follow the scale too (CSS overrides the width/height attributes) */
    .banner__title svg { width: calc(258.5 * var(--u)); height: calc(48 * var(--u)); }
    .banner__btn-label { width: calc(142 * var(--u)); height: calc(17 * var(--u)); }
    .banner__btn-icon  { width: calc(21.355 * var(--u)); height: calc(21.355 * var(--u)); }

    /* Title — outlined from the Figma export so it renders in Ping AR + LT */
    .banner__title {
      position: absolute;
      top: calc(34 * var(--u));
      left: calc(24 * var(--u));
      margin: 0;
      line-height: 0;
    }

    .banner__title svg {
      display: block;
    }

    /* Explore Initiative button — 195.401 × 51.253 */
    .banner__btn {
      position: absolute;
      top: calc(119.53 * var(--u));
      left: calc(24 * var(--u));
      width: calc(195.401 * var(--u));
      height: calc(51.253 * var(--u));
      /* Figma stroke: 1.068px #00BF00. Drawn as an inset ring because browsers round
         border-width down to whole pixels, which made it look thin and pale when scaled. */
      --btn-ring: inset 0 0 0 max(1.25px, calc(1.068 * var(--u))) var(--vivid-green-01);
      border: none;
      box-shadow: var(--btn-ring);
      border-radius: calc(10.678 * var(--u));
      background: var(--white-06);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .banner__btn:hover {
      background: #f2fcf2;
    }

    .banner__btn:focus-visible {
      outline: 2px solid var(--white-06);
      outline-offset: calc(3 * var(--u));
    }

    .banner__btn-label,
    .banner__btn-icon {
      position: absolute;
      display: block;
    }

    .banner__btn-label {
      top: calc(15.402 * var(--u));
      left: calc(10.932 * var(--u));
    }

    .banner__btn-icon {
      top: calc(14.162 * var(--u));
      left: calc(155.732 * var(--u));
    }

  
    /* ==========================================================
       Micro-interactions
       ========================================================== */

    /* Entrance: content rises in, illustration slides in */
    .banner__title,
    .banner__btn {
      animation: rise-in 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .banner__btn  { animation-delay: 0.12s; }

    .banner__art {
      animation: art-in 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s both;
    }

    @keyframes rise-in {
      from { opacity: 0; translate: 0 calc(12 * var(--u)); }
      to   { opacity: 1; translate: 0 0; }
    }

    @keyframes art-in {
      from { opacity: 0; translate: calc(24 * var(--u)) 0; }
      to   { opacity: 1; translate: 0 0; }
    }

    /* SVG groups transform around their own box */
    .banner__art g {
      transform-box: fill-box;
    }

    /* Chevron pattern: a soft light wave travelling left → right */
    .art-chevron {
      animation: chevron-wave 3.2s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.18s);
    }

    @keyframes chevron-wave {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    /* Plant sways from its base */
    .art-plant {
      transform-origin: 50% 100%;
      animation: sway 4.5s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-2.5deg); }
      50%      { transform: rotate(2.5deg); }
    }

    /* Phone + person float gently together */
    .art-figure {
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }

    /* Payment chip pulses as if being tapped */
    .art-chip {
      transform-origin: 50% 50%;
      animation: chip-tap 2.6s ease-in-out infinite;
    }

    @keyframes chip-tap {
      0%, 70%, 100% { transform: scale(1); }
      80%           { transform: scale(0.94); }
      90%           { transform: scale(1.04); }
    }

    /* Card gives a small lift on a slower cycle */
    .art-card {
      transform-origin: 50% 50%;
      animation: card-lift 5s ease-in-out infinite;
      animation-delay: 1.2s;
    }

    @keyframes card-lift {
      0%, 80%, 100% { transform: translateY(0) rotate(0); }
      88%           { transform: translateY(-2px) rotate(-1.5deg); }
    }

    /* Banner hover: illustration leans in a little */
    .banner:hover .art-person {
      transform: translateX(-1.5px);
    }

    .art-person {
      transition: transform 0.4s ease;
    }

    /* Button: lift on hover, press on click, arrow nudges up-right */
    .banner__btn {
      transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .banner__btn:hover {
      transform: translateY(calc(-2 * var(--u)));
      box-shadow: var(--btn-ring), 0 calc(6 * var(--u)) calc(16 * var(--u)) rgba(0, 0, 78, 0.25);
    }

    .banner__btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: var(--btn-ring);
    }

    .banner__btn-icon {
      transition: transform 0.25s cubic-bezier(0.3, 1.5, 0.5, 1);
    }

    .banner__btn:hover .banner__btn-icon,
    .banner__btn:focus-visible .banner__btn-icon {
      transform: translate(calc(2.5 * var(--u)), calc(-2.5 * var(--u)));
    }

    /* Respect users who turn motion off */
    @media (prefers-reduced-motion: reduce) {
      .banner *,
      .banner *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
    }
</style>
